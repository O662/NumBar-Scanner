<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<script>
  /* Inline and blocking on purpose: the stored theme has to land on <html>
     before the first paint, otherwise light-mode users get a flash of black. */
  (function () {
    var t;
    try { t = localStorage.getItem('numbar-theme'); } catch (e) { /* private mode */ }
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<title>NumBar Scanner</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>▌▏▌</text></svg>">
</head>
<body>

<!-- ───────────────────────── CAMERA VIEW ───────────────────────── -->
<section id="camera-view" class="view is-active">
  <video id="video" playsinline muted autoplay></video>

  <div id="reticle" aria-hidden="true">
    <div class="reticle-box">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
  </div>

  <!-- Parked at 0 opacity; JS moves it to the tap and replays the animation. -->
  <div id="focus-ring" aria-hidden="true"></div>

  <div id="camera-error" class="overlay-message" hidden></div>

  <div class="camera-bar">
    <button id="manual-btn" class="ghost-btn" type="button">Type</button>
    <button id="scan-btn" class="shutter" type="button" aria-label="Scan">
      <span class="shutter-ring"></span>
    </button>
    <button id="flip-btn" class="ghost-btn" type="button" hidden>Flip</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" hidden>
    <span class="spinner"></span><span id="status-text">Reading…</span>
  </div>
</section>

<!-- ───────────────────────── RESULT VIEW ───────────────────────── -->
<section id="result-view" class="view">
  <header class="result-header">
    <h1>Scanned</h1>
  </header>

  <div class="code-editor">
    <input id="digits" class="digits" type="text" inputmode="numeric"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           aria-label="Barcode digits">
  </div>

  <div class="barcode-card">
    <svg id="barcode" role="img" aria-label="Generated barcode"></svg>
    <p id="barcode-error" class="barcode-error" hidden></p>
  </div>

  <div class="format-row">
    <label for="format">Symbology</label>
    <select id="format">
      <option value="auto" selected>Auto</option>
      <option value="CODE128">Code 128</option>
      <option value="UPC">UPC-A</option>
      <option value="EAN13">EAN-13</option>
      <option value="EAN8">EAN-8</option>
      <option value="ITF">Interleaved 2 of 5</option>
    </select>
    <span id="format-used" class="format-used"></span>
  </div>

  <button id="clear-btn" class="primary-btn" type="button">Clear</button>
</section>

<!-- Sibling of the result view so CSS can show it only while that view is up. -->
<button id="theme-btn" class="theme-toggle" type="button" aria-label="Switch to light mode">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path>
  </svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
